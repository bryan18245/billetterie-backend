<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3ec5a4" />
            <stop offset="100%" stop-color="#289a7f" />
        </linearGradient>
    </defs>

    <!-- Fond arrondi -->
    <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

    <!-- Sac shopping -->
    <g transform="translate(50, 52)">
        <!-- Corps du sac -->
        <path d="M -18 -8 L 18 -8 L 22 22 Q 22 26 18 26 L -18 26 Q -22 26 -22 22 Z"
              fill="#ffffff" />

        <!-- Bandes verticales décoratives -->
        <line x1="-7" y1="-6" x2="-7" y2="24" stroke="#32B394" stroke-width="1.2" opacity="0.4"/>
        <line x1="7" y1="-6" x2="7" y2="24" stroke="#32B394" stroke-width="1.2" opacity="0.4"/>

        <!-- Anses -->
        <path d="M -10 -8 Q -10 -22 0 -22 Q 10 -22 10 -8"
              fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

        <!-- Petit cœur ou étoile pour le côté "achat plaisir" -->
        <circle cx="0" cy="10" r="3" fill="#32B394" />
    </g>
</svg>